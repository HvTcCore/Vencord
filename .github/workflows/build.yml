name: Build DevBuild
on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/build/**
            - package.json
            - pnpm-lock.yaml
env:
    FORCE_COLOR: true
    plugins_changed: false
permissions:
    contents: write

jobs:
    Build:
        runs-on: ubuntu-latest
        outputs:
            files: ${{ steps.list_files.outputs.files }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm build --standalone

            - name: Generate plugin list
              run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

            - name: Clean up obsolete files
              run: |
                  rm -rf dist/*-unpacked dist/vendor Vencord.user.css vencordDesktopRenderer.css vencordDesktopRenderer.css.map

            - name: List files for artifacts
              id: list_files
              run: |
                echo "files=$(ls dist/* | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: 1.All-In-One
                  path: dist/

            - name: Get some values needed for the release
              id: release_values
              run: |
                  echo "release_tag=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Upload DevBuild as release
              if: github.repository == 'HvTcCore/Vencord'
              run: |
                  gh release upload devbuild --clobber dist/*
                  gh release edit devbuild --title "DevBuild $RELEASE_TAG"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ env.release_tag }}

    Upload-Artifacts:
        needs: Build
        runs-on: ubuntu-latest
        strategy:
            matrix:
                file: ${{ fromJson(needs.Build.outputs.files) }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: 1.All-In-One
                  path: dist

            - name: Get filename
              id: filename
              run: echo "name=$(basename ${{ matrix.file }})" >> $GITHUB_OUTPUT

            - name: Upload Individual Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.filename.outputs.name }}
                  path: ${{ matrix.file }}
